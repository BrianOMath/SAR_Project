name: tests
 
on: [push, pull_request]
 
# The Python package lives in S1_Recon/, not at the repo root, so every
# `run:` step needs to start there. `uses:` steps (checkout, setup-python)
# are unaffected -- working-directory applies only to run steps.
defaults:
  run:
    working-directory: S1_Recon
 
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: S1_Recon/requirements.txt
 
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
 
      - name: Run tests
        run: python -m pytest -q
 